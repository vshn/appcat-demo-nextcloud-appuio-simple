env:
  KUBECONFIG: /tmp/github-ci.kubeconfig
  REGISTRY: registry.cloudscale-lpg-2.appuio.cloud
  TEST_DOMAIN: apps.cloudscale-lpg-2.appuio.cloud
jobs:
  build:
    environment: prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: ./.github/actions/setup
        with:
          KUBECONFIG_DATA: "${{ secrets.KUBECONFIG_PROD }}"
      - env:
          NEWLINE: |2+

        name: Helm Chart preview
        run: |
          cd "helm"
          jq -n '.env=(env | with_entries(select(.key | startswith("KUBECONFIG_") | not)))' > env.yaml
          jq 'select(.!=null)|{vars:.,env:.}' > vars.yaml <<'EOF' ${{ env.NEWLINE }}${{ toJson(vars) }}${{ env.NEWLINE }}EOF
          jq 'select(.!=null)|{secrets:.,env:.}' > secrets.yaml <<'EOF' ${{ env.NEWLINE }}${{ toJson(secrets) }}${{ env.NEWLINE }}EOF
          jq '.env | keys' env.yaml
          jq '.env | keys' vars.yaml
          jq '.env | keys' secrets.yaml

          cp "${KUBECONFIG}" ".github-ci.kubeconfig"
          docker run -v "${PWD}:/data" -w /data ghcr.io/appuio/helm:latest /bin/bash -c "cp .github-ci.kubeconfig /tmp/github-ci.kubeconfig; chmod 400 /tmp/github-ci.kubeconfig; /bin/helm dependency update .; HELM_DIFF_USE_UPGRADE_DRY_RUN=true /bin/helm diff upgrade 'prod' . --namespace '${NAMESPACE}' --values "values.yaml" --values "env.yaml" --values vars.yaml --values secrets.yaml --kubeconfig /tmp/github-ci.kubeconfig --allow-unreleased"
      - env:
          NEWLINE: |2+

        name: Helm Chart deploy
        run: |
          cd "helm"
          jq -n '.env=(env | with_entries(select(.key | startswith("KUBECONFIG_") | not)))' > env.yaml
          jq 'select(.!=null)|{vars:.,env:.}' > vars.yaml <<'EOF' ${{ env.NEWLINE }}${{ toJson(vars) }}${{ env.NEWLINE }}EOF
          jq 'select(.!=null)|{secrets:.,env:.}' > secrets.yaml <<'EOF' ${{ env.NEWLINE }}${{ toJson(secrets) }}${{ env.NEWLINE }}EOF
          cp "${KUBECONFIG}" ".github-ci.kubeconfig"
          docker run -v "${PWD}:/data" -w /data ghcr.io/appuio/helm:latest /bin/bash -c "cp .github-ci.kubeconfig /tmp/github-ci.kubeconfig; chmod 400 /tmp/github-ci.kubeconfig; /bin/helm dependency update .; /bin/helm upgrade --install 'prod' . --namespace '${NAMESPACE}' --values "values.yaml" --values "env.yaml" --values vars.yaml --values secrets.yaml --kubeconfig /tmp/github-ci.kubeconfig"
name: Build and deploy to prod
"on":
  push:
    branches:
      - main
  workflow_dispatch: {}
